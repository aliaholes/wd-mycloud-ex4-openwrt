# /etc/smartd.conf (EX4 persistent system v1; replaces v8's "watches NOTHING"). Started by ex4-svc after md1.
# Every ATA disk: health, attributes, errors, self-test log (-a); never wakes a sleeping disk (-n standby,q: skipped,
# quietly); temperature: log a change of 4 C, info at 45 C, CRIT at 50 C (-W 4,45,50). No mail: every warning runs the
# local hook (-m <nomailer> -M exec), which only logs (TODO E2: Telegram + inbox via a LAN relay).
DEVICESCAN -d removable -a -n standby,q -W 4,45,50 -m <nomailer> -M exec /usr/libexec/ex4/smart-alert
