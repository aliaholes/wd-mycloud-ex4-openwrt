# smallfiles.conf : Balanced, plus these. Many people, many small files (format: balanced.conf's header).
title	Many users & small files
blurb	Several people at once, lots of small files: documents, code, photos, home folders.
set	md.read_ahead_kb	128	# read only 128 KiB ahead (the kernel's 384 KiB): opening a small file does not drag its neighbours off the disks
set	md.stripe_cache_size	1024	# 1024 stripes = 16 MiB of RAM: a small write needs the old data and parity first; a bigger cache keeps them for the next write nearby
set	disk.scheduler	mq-deadline	# no reader waits forever behind a long write. THIS KERNEL OFFERS ONLY "none": set only when a kernel offers it
set	vm.dirty_bytes	33554432	# at most 32 MiB waiting to be written: a save or a sync never waits behind much
set	vm.dirty_background_bytes	8388608	# background writing from 8 MiB: small and steady
set	vm.dirty_expire_centisecs	1500	# anything older than 15 s is written (the kernel's 30 s): a shorter window on a power cut
set	vm.vfs_cache_pressure	50	# keep folder and file entries in memory longer (the kernel's 100): a big folder lists from memory the second time
set	ext4.atime	noatime	# opening a file never writes its "last read" time
set	ext4.lazytime	on	# file times are kept in memory and written with the next real write (at most 24 h later)
opt	casesensitive	smb.case_sensitive	yes	# Samba stops searching a whole folder for other spellings of a name: big folders get fast
opt	casesensitive	smb.preserve_case	yes	# names are kept exactly as typed
opt	casesensitive	smb.short_preserve_case	yes	# short (8.3) names too
warn	casesensitive	Windows and Macs treat "Report.doc" and "report.doc" as one file. With this on, a program that asks for a name spelled differently from the file gets "not found", and two files may differ only by case. It applies to every share. Only for shares used from Linux, or by programs that always spell names the same way.
advice	Samba's SMB2 leases (clients may cache what they read) are already on: that is Samba's own default, so no profile needs to change it.
advice	A fair disk scheduler (mq-deadline or BFQ) is not built into this kernel; it needs a kernel build. Until then the disks run their own queue (NCQ).
