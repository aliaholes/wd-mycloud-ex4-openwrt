# backups.conf : Balanced, plus these. Machines writing backups on a schedule (format: balanced.conf's header).
title	Backups (Time Machine / rsync)
blurb	Computers backing up to it on a schedule: mostly writing, with many "make sure it is on the disk" requests.
set	md.stripe_cache_size	1024	# 1024 stripes = 16 MiB of RAM: backup streams mix big and small writes; fewer parity reads
set	ext4.atime	noatime	# rsync reading the backup to compare never writes "last read" times
set	smb.strict_sync	yes	# when a Mac or rsync asks "is it on the disk?", the answer is true (Samba's own default, pinned)
set	smb.fruit_wipe_rfork	yes	# Mac backups: empty resource forks are dropped (Samba's vfs_fruit advice for Time Machine)
set	smb.fruit_delete_empty_adfiles	yes	# and empty AppleDouble (._) files
advice	Time Machine itself is a switch per share, on the Shares page ("A Time Machine target for Macs"). It needs Samba: ksmbd cannot answer a Mac's Time Machine questions.
