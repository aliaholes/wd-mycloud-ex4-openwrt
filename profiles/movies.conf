# movies.conf : Balanced, plus these. Big files, one or two at a time (format: balanced.conf's header).
title	Movies & big files
blurb	A few people moving big files: films, disk images, archives, camera footage.
set	md.read_ahead_kb	6144	# read 6 MiB ahead (32 full stripes of 192 KiB) instead of the kernel's 384 KiB: all four disks stay busy for one stream
set	md.stripe_cache_size	2048	# 2048 stripes = 32 MiB of RAM (the kernel's 256 = 4 MiB): more writes fill a whole stripe, so parity needs no reads first
set	vm.dirty_background_bytes	33554432	# background writing starts at 32 MiB, not 16: bigger batches reach the array, more of them whole stripes (the 64 MiB ceiling stays)
set	ext4.atime	noatime	# watching a film never writes its "last read" time back to the disks
set	ext4.commit	30	# the journal commits every 30 s, not 5: fewer flushes in a long write. A power cut can lose up to 30 s of new writes; nothing older
set	smb.use_sendfile	yes	# a read goes from memory to the network without a copy through Samba (clients that do not sign only: see the advice)
set	smb.min_receivefile_size	16384	# a write over 16 KiB goes from the network to the file without a copy through Samba (the same signing caveat)
set	smb.aio_read_size	0	# one core: a read is done in place, not handed to a helper thread and back
set	smb.aio_write_size	0	# the same for writes
opt	spindown	disk.standby_min	20	# the disks sleep after 20 idle minutes
warn	spindown	Opening a file after the disks have slept waits about 10-30 seconds while all four spin up. Many sleep/wake cycles a day wear drives more than spinning; for a box used all day, leave this off.
advice	ksmbd (the kernel's own SMB server) may beat Samba on writes here; that is a separate measured choice (SERVING.md 1.4), not part of this profile.
