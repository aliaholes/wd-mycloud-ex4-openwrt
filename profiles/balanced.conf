# balanced.conf : THE DEFAULT, and the base every other profile starts from (docs/PROFILES.md).
# Format, one per line, TAB or spaces between fields, '#' starts a comment:
#   title  TEXT                  the card's name
#   blurb  TEXT                  one line under it: who this is for
#   set    KNOB VALUE  # WHY     a knob from ex4-profile's allow-list; the WHY is shown on the page as written
#   opt    NAME KNOB VALUE # WHY  only when the owner ticks NAME (opt-in), never by default
#   warn   NAME TEXT             the warning shown beside opt NAME
#   advice TEXT                  a line of advice for the page: things no button can change
# ex4-profile refuses a knob it does not know, a value outside its range, and any FORBIDDEN word anywhere in a line.
title	Balanced
blurb	A bit of everything. The kernel's and Samba's own settings, with one change: less data waiting to be written.
set	vm.dirty_bytes	67108864	# at most 64 MiB waiting to be written (the kernel's own ceiling is ~20% of free RAM, ~94 MiB here, an estimate): less lost on a power cut, shorter stalls (the rw bench's own cap)
set	vm.dirty_background_bytes	16777216	# writing starts in the background at 16 MiB (the kernel's own: ~10%, ~47 MiB here, an estimate): a steadier stream to the disks
advice	One core does everything here: moving a file at ~55 MiB/s already takes all of it. The settings below change how that core spends its time; none of them adds speed the processor does not have.
advice	Windows 11 (24H2 and later) and Macs sign every SMB packet by default. Signing costs this processor more per byte than any setting here saves, and it turns off Samba's copy-free paths (sendfile, receivefile). Nothing on the box can switch a client's signing off safely.
advice	A 4-disk RAID 5 is the wrong shape for many small random writes: each one reads old data and parity before it writes (four disk operations for one). RAID 10 does them in two. That is chosen when the array is made, never here.
advice	Fixed when the array and file system were made, so never a button: the RAID level, the chunk (64 KiB here), ext4's stride/stripe-width, and how many files the disk can hold (the inode ratio).
